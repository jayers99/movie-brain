[project]
name = "movie-brain"
version = "0.1.0"
description = "Personal film brain — Criterion listings, OMDb ratings, my ratings, in SQLite with a local dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.1",
    "rich>=13.9.4",
    "flask>=3.1.3",
    "requests>=2.32",
]

[project.scripts]
movie-brain = "movie_brain.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-bdd>=8.1.0",
    "responses>=0.25",
    "pytest-playwright>=0.7.2",
    "ruff>=0.8.4",
    "mypy>=1.14.1",
    "types-requests>=2.32",
    "pre-commit>=4.5.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs", "scripts/discovery"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["responses", "responses.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/movie_brain"]
