<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>movie-brain</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="top">
    <h1>movie-brain</h1>
    <div id="counts">
      <span><b id="count-films">–</b> films</span>
      <span><b id="count-reachable">–</b> reachable</span>
      <span><b id="count-owned">–</b> owned</span>
      <span><b id="count-mine">–</b> rated by me</span>
      <span id="count-showing" class="showing"></span>
    </div>
    <div id="search-row">
      <input id="search" class="search" type="search" placeholder="search — or actor: bogart · character: marlowe · genre: film noir · director: hawks year: 1940-1949" autocomplete="off" spellcheck="false" aria-label="Search films">
      <div id="search-note" class="search-note" hidden></div>
    </div>
    <div id="chips">
      <!-- Four three-way chips (off → A → B → off) and two plain ones, everything off by default.
           A cycle chip carries its keys in data-cycle and its labels (off first) in data-labels — the yes-state keeps the plain
           word, the filled background alone says it is on; the
           keys are ordinary CHIP_PREDICATES entries, so URL state is still just `chips=`. -->
      <button class="chip" data-cycle="reachable,unreachable" data-labels="Reachable|Reachable|Not reachable" data-group="reach">Reachable</button>
      <button class="chip" data-cycle="unrated,mine" data-labels="Rated|Unrated by me|Rated by me" data-group="rated">Rated</button>
      <button class="chip" data-cycle="criterion,leaving,criterion_new,not_criterion" data-labels="Criterion|Criterion|Criterion leaving|Criterion new|Not Criterion" data-group="criterion">Criterion</button>
      <button class="chip" data-chip="watchlist">Watchlist</button>
      <button class="chip" data-cycle="owned,not_owned" data-labels="Owned|Owned|Not owned" data-group="owned">Owned</button>
      <button class="chip" data-chip="multi_list">On a list</button>
      <select id="list-picker" class="picker" title="Filter to one curated list and order by its rank"></select>
      <button id="chips-clear" class="chip clear">Clear</button>
    </div>
  </header>

  <div class="table-wrap" id="table-wrap">
    <table id="films">
      <colgroup>
        <col class="col-title"><col class="col-year"><col class="col-director"><col class="col-language">
        <col class="col-mc"><col class="col-rt"><col class="col-imdb"><col class="col-rating"><col class="col-info">
      </colgroup>
      <thead>
        <tr class="labels">
          <th class="sortable" data-col="title">Title</th>
          <th class="sortable" data-col="year">Year</th>
          <th class="sortable" data-col="director">Director</th>
          <th class="sortable" data-col="language">Language</th>
          <th class="sortable num" data-col="metacritic">MC</th>
          <th class="sortable num" data-col="rt">RT</th>
          <th class="sortable num" data-col="imdb">IMDb</th>
          <th class="sortable num" data-col="my_rating">My Rating</th>
          <th></th>
        </tr>
        <tr class="filters">
          <th><input id="f-title" type="search" placeholder="filter…"></th>
          <th><input id="f-year-min" type="number" placeholder="min" class="half"><input id="f-year-max" type="number" placeholder="max" class="half"></th>
          <th><input id="f-director" type="search" placeholder="filter…"></th>
          <th class="lang-cell">
            <input id="f-lang-input" type="search" placeholder="filter…" autocomplete="off" aria-haspopup="true">
            <div id="f-lang-panel" hidden></div>
          </th>
          <th><input id="f-mc-min" type="number" placeholder="min" class="half"><input id="f-mc-max" type="number" placeholder="max" class="half"></th>
          <th><input id="f-rt-min" type="number" placeholder="min" class="half"><input id="f-rt-max" type="number" placeholder="max" class="half"></th>
          <th><input id="f-imdb-min" type="number" step="0.1" placeholder="min" class="half"><input id="f-imdb-max" type="number" step="0.1" placeholder="max" class="half"></th>
          <th></th><th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="drawer-backdrop" hidden></div>
  <aside id="drawer" hidden aria-label="Film details">
    <button id="drawer-close" aria-label="Close">✕</button>
    <div id="drawer-body"></div>
  </aside>
  <div id="toast" hidden></div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
