<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>movie-brain · rank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='rank.css') }}">
</head>
<body>
  <header class="top">
    <h1><a href="/">movie-brain</a> · rank</h1>
    <nav class="tabs" aria-label="Mode">
      <button class="tab" data-mode="tiers">Tiers</button>
      <span class="tab-group" aria-label="Order a tier">Order tier
        <button class="tab" data-mode="order-1">1</button>
        <button class="tab" data-mode="order-2">2</button>
        <button class="tab" data-mode="order-3">3</button>
        <button class="tab" data-mode="order-4">4</button>
        <button class="tab" data-mode="order-5">5</button>
      </span>
    </nav>
    <div id="note" class="note" aria-live="polite"></div>
    <div id="progress" hidden>
      <span class="tiers-only"><b id="placed">–</b> placed</span>
      <span class="tiers-only"><b id="remaining">–</b> remaining</span>
      <span class="tiers-only"><b id="unseen-count">–</b> unseen</span>
      <span class="tally tiers-only"><span data-tier="1">–</span><span data-tier="2">–</span><span data-tier="3">–</span><span data-tier="4">–</span><span data-tier="5">–</span></span>
      <span class="order-only"><b id="ordered">–</b> ordered in tier <b id="order-tier">–</b></span>
      <span class="order-only"><b id="order-remaining">–</b> remaining</span>
      <button id="undo" class="chip" title="Undo the last click (U)">Undo</button>
      <span class="save-row"><input id="list-name" placeholder="My Ranking"><button id="save" class="chip">Save as list</button></span>
    </div>
  </header>
  <main id="rank" data-state="">
    <section id="setup" hidden>
      <p id="setup-lead"></p>
      <div id="anchor-cards"></div>
      <button id="start" class="chip primary">Start</button>
    </section>
    <section id="pair" hidden>
      <div class="pass-row"><button id="pass" class="chip primary" title="Next matchup (space)">Pass</button></div>
      <div class="sides">
        <div class="side candidate" data-side="candidate"></div>
        <div class="side anchor" data-side="anchor"></div>
      </div>
    </section>
    <section id="done" hidden><p>Every film in the pool is placed. Save the list above.</p></section>
    <section id="order-empty" hidden><p>Start a tiering session first — the order lives inside it.</p></section>
    <section id="order-done" hidden><p>Every film in this tier is ordered. Save the list above.</p></section>
  </main>
  <script src="{{ url_for('static', filename='rank.js') }}"></script>
</body>
</html>
